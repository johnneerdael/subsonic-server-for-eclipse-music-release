services:
  eclipse-subsonic:
    image: ghcr.io/johnneerdael/subsonic-server-for-eclipse-music:latest
    container_name: eclipse-subsonic
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-4533}:4533"
    volumes:
      - ./data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SUBSONIC_USER: ${SUBSONIC_USER:-eclipse}
      SUBSONIC_PASSWORD: ${SUBSONIC_PASSWORD:-}
      SUBSONIC_API_KEY: ${SUBSONIC_API_KEY:-}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-1073741824}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-360}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BASE_PATH: ${BASE_PATH:-}
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4533/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
